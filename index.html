<style>
  :root{
    --paper:#efe9dc; --paper-line:#d8cfb8; --ink:#26302b; --ink-soft:#5b6259;
    --teal:#2f6f5e; --teal-deep:#1f4f42; --alert:#c1502e; --alert-bg:#f3ddd3;
    --ok-bg:#e1ebe1; --card:#f7f4ea; --gold:#b8863f;
  }
  *{box-sizing:border-box; touch-action:manipulation;}
  body{
    margin:0;
    background: repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(90,90,60,0.05) 28px), var(--paper);
    color:var(--ink); font-family:-apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    padding-bottom:120px;
  }
  header{ padding:28px 20px 18px; text-align:center; }
  header h1{ font-family:Georgia,"Hiragino Mincho ProN","Yu Mincho",serif; font-size:22px; letter-spacing:.08em; margin:0 0 4px; }
  header p{ margin:0; font-size:12px; color:var(--ink-soft); letter-spacing:.05em; }
  .wrap{max-width:520px;margin:0 auto;padding:0 14px;}
  .card{ background:var(--card); border:1px solid var(--paper-line); border-radius:2px; padding:13px 14px 11px; margin-bottom:11px; box-shadow:0 1px 0 rgba(0,0,0,0.03); }
  .card h2{ font-size:12.5px; margin:0 0 9px; color:var(--teal-deep); display:flex; align-items:center; gap:6px; letter-spacing:.03em; }
  .card h2::before{content:"■";font-size:10px;color:var(--teal);}
  label{ display:block; font-size:11px; color:var(--ink-soft); margin-bottom:3px; }
  .field{margin-bottom:9px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  input[type=text], input[type=number], input[type=date], select{
    width:100%; padding:8px 9px; border:1px solid var(--paper-line); border-radius:3px;
    background:#fff; font-size:16px; font-family:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace; color:var(--ink);
  }
  input[type=text]{font-family:inherit;}
  select{font-family:inherit; font-size:16px;}
  input:focus, select:focus{ outline:2px solid var(--teal); outline-offset:1px; }
  input:disabled{ background:#eee; color:#999; }
  input:read-only{ background:#f1ede2; color:var(--teal-deep); font-family:inherit; }
  .item-row{ display:flex; gap:6px; margin-bottom:6px; align-items:center; }
  .item-row input{flex:1;min-width:0;}
  .item-row input.amount{max-width:100px;flex:0 0 100px;}
  .item-row .del{ flex:0 0 auto; background:none;border:none;color:var(--alert); font-size:18px;line-height:1;cursor:pointer;padding:4px 6px; }
  .add-btn{ display:inline-flex;align-items:center;gap:4px; background:none;border:1px dashed var(--teal); color:var(--teal-deep); font-size:11.5px;padding:5px 9px;border-radius:3px;cursor:pointer;margin-top:2px; }
  .add-btn.small{font-size:11px;padding:4px 8px;}
  .add-btn:active{background:var(--ok-bg);}
  .subtotal{ display:flex;justify-content:space-between; align-items:center; font-size:12.5px;color:var(--teal-deep); border-top:1px dashed var(--paper-line); margin-top:6px;padding-top:6px; }
  .subtotal b{font-family:ui-monospace,monospace;font-size:14.5px;}
  .subtotal-input{
    width:110px; padding:3px 5px; border:1px solid transparent; border-radius:3px;
    font-family:ui-monospace,monospace; font-size:14.5px; text-align:right; color:var(--teal-deep);
    background:transparent;
  }
  .subtotal-input:focus{ background:#fff; border-color:var(--teal); outline:none; }
  .subtotal-input.is-manual{ background:#fbf3e3; border-color:var(--gold); color:#8a6420; }

  .staff-card{ border:1px solid var(--paper-line); border-radius:4px; padding:10px; margin-bottom:12px; background:#fffdf7; }
  .staff-head{ display:flex; gap:5px; margin-bottom:5px; flex-wrap:wrap; }
  .staff-head .staff-name-select{flex:1.3; min-width:110px; font-size:13px; padding:6px 7px;}
  .staff-head .staff-name-custom{flex:1.3; min-width:110px; font-size:13px; padding:6px 7px;}
  .staff-head .staff-hours{flex:0.7; min-width:70px; font-size:13px; padding:6px 7px;}
  .staff-head .del{ flex:0 0 auto; background:none;border:none;color:var(--alert); font-size:18px;cursor:pointer;padding:0 4px; }
  .chip-grid{ display:grid; grid-template-columns:1fr 1fr; gap:5px; margin:7px 0; }
  .chip{ display:flex; align-items:center; justify-content:space-between; gap:4px; background:var(--ok-bg); border:1px solid var(--paper-line); border-radius:4px; padding:5px 7px; }
  .chip-label{ font-size:10px; color:var(--ink); line-height:1.25; }
  .chip-label small{ display:block; color:var(--ink-soft); font-size:8.5px; }
  .stepper{ display:flex; align-items:center; gap:5px; flex:0 0 auto; }
  .stepper button{ width:19px;height:19px;border-radius:50%;border:1px solid var(--teal); background:#fff; color:var(--teal-deep); font-size:12px; line-height:1; cursor:pointer; padding:0; }
  .stepper button:active{background:var(--teal); color:#fff;}
  .chip-count{ font-family:ui-monospace,monospace; font-size:12px; min-width:13px; text-align:center; }

  .bottle-section{ margin-bottom:7px; }
  .bottle-section label{ margin-bottom:4px; font-size:10.5px; }
  .bottle-row{ display:flex; gap:5px; margin-bottom:6px; align-items:center; flex-wrap:wrap; }
  .bottle-row select{ flex:1.6; min-width:120px; font-size:13px; padding:6px 7px; }
  .bottle-row .tequila-toggle{ display:none; align-items:center; gap:3px; font-size:10px; color:var(--alert); flex:0 0 auto; white-space:nowrap; }
  .bottle-row .tequila-toggle input{ width:auto; }
  .bottle-row .custom-name{ flex:1; min-width:90px; display:none; font-size:13px; padding:6px 7px; }
  .bottle-row .custom-amount{ flex:0 0 80px; display:none; font-size:13px; padding:6px 7px; }
  .bottle-row .bottle-amount{ flex:0 0 auto; font-family:ui-monospace,monospace; font-size:12px; color:var(--teal-deep); min-width:56px; text-align:right; }
  .bottle-row .del{ flex:0 0 auto; background:none;border:none;color:var(--alert); font-size:17px;cursor:pointer;padding:2px 4px; }

  .staff-summary{ background:var(--card); border-radius:4px; padding:8px 8px 4px; font-size:11px; }
  .staff-summary > div{ display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
  .pt-next{ color:var(--gold); font-size:10px; margin-left:6px; }
  .transport-badge{ font-size:9.5px; padding:2px 6px; border-radius:10px; background:#e4e0d2; color:var(--ink-soft); white-space:nowrap; }
  .transport-badge.on{ background:var(--ok-bg); color:var(--teal-deep); }

<script>
// ---- 簡易パスワードゲート ----
// 変更したい場合は下のCORRECT_PASSWORD_HASHを新しいパスワードのSHA-256ハッシュに差し替えてください。
// ブラウザのコンソールで以下を実行するとハッシュが得られます:
// crypto.subtle.digest('SHA-256', new TextEncoder().encode('新しいパスワード')).then(b=>console.log(Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')))
const CORRECT_PASSWORD_HASH = '7d7179c146d0d6af4ebd304ab799a718fe949a8dcd660cd6d12fb97915f9ab0a'; // パスワード: 1054

async function sha256Hex(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function tryUnlock(){
  const input = document.getElementById('passwordInput');
  const err = document.getElementById('passwordError');
  const hash = await sha256Hex(input.value);
  if(hash === CORRECT_PASSWORD_HASH){
    document.getElementById('passwordGate').style.display = 'none';
    try{ localStorage.setItem('salesForm_unlocked', '1'); }catch(e){}
  } else {
    err.textContent = 'パスワードが違います';
    input.value = '';
    input.focus();
  }
}
document.addEventListener('DOMContentLoaded', ()=>{
  let alreadyUnlocked = false;
  try{ alreadyUnlocked = localStorage.getItem('salesForm_unlocked') === '1'; }catch(e){}
  if(alreadyUnlocked){
    document.getElementById('passwordGate').style.display = 'none';
  } else {
    document.getElementById('passwordInput').addEventListener('keydown', (e)=>{
      if(e.key === 'Enter') tryUnlock();
    });
  }
});

function fmt(n){ n = Math.round(n||0); return n.toLocaleString('ja-JP'); }
function parseNum(v){ const n = parseFloat(String(v==null?'':v).replace(/,/g,'')); return isNaN(n)?0:n; }
function num(id){ return parseNum(document.getElementById(id).value); }

// Live comma (3-digit) grouping for every numeric text field in the app,
// including manually-typed values. Uses event delegation so it also covers
// fields created dynamically later (staff cards, expense rows, settings rows).
function formatNumberInput(el){
  const raw = el.value.replace(/[^0-9]/g, '');
  if(raw === ''){ el.value = ''; return; }
  const selStart = el.selectionStart == null ? el.value.length : el.selectionStart;
  const digitsBeforeCursor = (el.value.slice(0, selStart).match(/[0-9]/g) || []).length;
  const formatted = Number(raw).toLocaleString('ja-JP');
  el.value = formatted;
  if(document.activeElement === el){
    let count = 0, pos = formatted.length;
    for(let i = 0; i < formatted.length; i++){
      if(/[0-9]/.test(formatted[i])) count++;
      if(count === digitsBeforeCursor){ pos = i + 1; break; }
    }
    try{ el.setSelectionRange(pos, pos); }catch(e){}
  }
}
document.addEventListener('input', function(e){
  const el = e.target;
  if(el.tagName === 'INPUT' && el.type === 'text' && el.getAttribute('inputmode') === 'numeric'){
    formatNumberInput(el);
  }
});

function addRow(listId, prefix){
  const id = 'r' + (rowId++);

  arr.push(id);
  const list = document.getElementById(listId);
  const div = document.createElement('div');
  div.className = 'item-row'; div.id = id;
  div.innerHTML = '<input type="text" placeholder="項目名" oninput="recalc()">' +
    '<input type="text" class="amount" placeholder="金額" inputmode="numeric" oninput="recalc()">' +
    '<button class="del" onclick="removeRow(\''+id+'\',\''+prefix+'\')">×</button>';
  list.appendChild(div); recalc();
}
function removeRow(id, prefix){
  document.getElementById(id).remove();
  const arr = prefix === 'otherCard' ? otherCardRows : expenseRows;
  const idx = arr.indexOf(id); if(idx>-1) arr.splice(idx,1);
  recalc();
}
function collectItems(ids){
  return ids.map(id=>{
    const el = document.getElementById(id); if(!el) return null;
    const inputs = el.querySelectorAll('input');
    return { name: inputs[0].value, amount: parseNum(inputs[1].value) };
  }).filter(Boolean);
}

    const items = BOTTLE_ITEMS.filter(it=>it.type===type);
    if(!items.length) return;

  });
  html += '<option value="__custom__">自由入力</option>';
  return html;
}

function wageForPoints(pts){
  for(const t of WAGE_TIERS){ if(pts >= t.p) return t.w; }
  return BASE_WAGE;
}
function nextTierHint(pts){
  const asc = [...WAGE_TIERS].sort((a,b)=>a.p-b.p);
  for(const t of asc){ if(pts < t.p) return '次('+t.p+'pt→¥'+fmt(t.w)+')まであと'+(t.p-pts)+'pt'; }
  return '最高ランク到達';
}

function computeStaff(staffId){
  const card = document.getElementById(staffId);
  const sel = card.querySelector('.staff-name-select');
  const customName = card.querySelector('.staff-name-custom');
  const name = (sel.value === '__custom__') ? customName.value : sel.value;
  const hours = parseFloat(card.querySelector('.staff-hours').value) || 0;

  let points = 0;
  card.querySelectorAll('.chip[data-key]').forEach(chip=>{
    const pt = parseFloat(chip.dataset.pt);
    const count = parseInt(chip.querySelector('.chip-count').textContent) || 0;
    points += pt * count;
  });
  const manualPointsInput = card.querySelector('.manual-points');
  const manualPoints = parseNum(manualPointsInput.value);
  points += manualPoints;

  // bottle backs (yen, separate from points)
  let backTotal = 0;
  const bottleItems = [];
  card.querySelectorAll('.bottle-row').forEach(row=>{
    const rsel = row.querySelector('.bottle-select');
    const amountSpan = row.querySelector('.bottle-amount');
    if(rsel.value === '__custom__'){
      const bname = row.querySelector('.custom-name').value;
      const bamt = parseNum(row.querySelector('.custom-amount').value);
      backTotal += bamt;
      if(bname || bamt) bottleItems.push({name:bname||'自由入力', amount:bamt});
    } else if(rsel.value !== ''){
      const parts = rsel.value.split('|');
      const bname = parts[0];
      let bamt = parseFloat(parts[1]);
      const type = parts[2];
      const tequilaChecked = row.querySelector('.tequila-toggle input').checked;
      if(type === 'wheel' && tequilaChecked) bamt *= 2;
      amountSpan.textContent = '¥' + fmt(bamt);
      backTotal += bamt;
      bottleItems.push({name:bname + (tequilaChecked?'（テキーラ）':''), amount:bamt});
    }
  });

  const wageTier = wageForPoints(points);
  const transportEligible = points >= TRANSPORT_THRESHOLD;
  const fareInput = card.querySelector('.transport-fare');
  fareInput.disabled = !transportEligible;
  const badge = card.querySelector('.transport-badge');
  if(transportEligible){
    badge.textContent = '交通費対象（往復）';
    badge.classList.add('on');
    if(!fareInput.value){
      const def = parseFloat(card.dataset.defaultFare) || 0;
      if(def) fareInput.value = fmt(def);
    }
  } else {
    badge.textContent = '交通費対象外（3pt未満）';
    badge.classList.remove('on');
    fareInput.value = '';
  }
  const fare = transportEligible ? parseNum(fareInput.value) : 0;

  const wage = wageTier * hours + fare + backTotal;

  card.querySelector('.pt-total').textContent = points;
  card.querySelector('.pt-next').textContent = nextTierHint(points);
  card.querySelector('.wage-tier').textContent = '¥' + fmt(wageTier);
  card.querySelector('.back-total').textContent = '¥' + fmt(backTotal);
  card.querySelector('.staff-wage').textContent = '¥' + fmt(wage);

  return { name, hours, points, wageTier, fare, bottleItems, backTotal, wage };
}

function recalc(){
  const otherCardItems = collectItems(otherCardRows);
  const expenseItems = collectItems(expenseRows);
  const otherCardTotal = otherCardItems.reduce((s,i)=>s+i.amount,0);
  const expenseTotal = expenseItems.reduce((s,i)=>s+i.amount,0);

  document.getElementById('expenseTotal').textContent = fmt(expenseTotal);

  const staffResults = staffIds.map(computeStaff);
  const autoWageTotal = staffResults.reduce((s,r)=>s+r.wage,0);
  const wageTotalInput = document.getElementById('wageTotal');
  let wageTotal;
  if(wageTotalManuallyEdited){
    wageTotal = parseNum(wageTotalInput.value);
    wageTotalInput.classList.add('is-manual');
  } else {
    wageTotal = autoWageTotal;
    wageTotalInput.value = fmt(wageTotal);
    wageTotalInput.classList.remove('is-manual');
  }

  const staffNameStr = staffResults.map(r=>r.name).filter(Boolean).join('・');
  if(!staffNamesManuallyEdited){
    document.getElementById('staffNames').value = staffNameStr;
  }

  const startCash = num('startCash');
  const cashSales = num('cashSales');
  const otherCashSales = num('otherCashSales');
  const atmDeposit = num('atmDeposit');
  const endCashActual = num('endCashActual');

  const theoretical = startCash + cashSales + otherCashSales - expenseTotal - wageTotal - atmDeposit;
  const diff = endCashActual - theoretical;

  document.getElementById('theoLine').textContent = '¥' + fmt(theoretical);
  document.getElementById('actualLine').textContent = '¥' + fmt(endCashActual);

  const diffEl = document.getElementById('diffValue');
  const labelEl = document.getElementById('diffLabel');
  if(diff === 0){
    labelEl.textContent = '過不足'; diffEl.textContent = '±0'; diffEl.className = 'status-ok';
  } else if(diff > 0){
    labelEl.textContent = '過剰（レジが多い）'; diffEl.textContent = '+¥' + fmt(diff); diffEl.className = 'status-bad';
  } else {
    labelEl.textContent = '不足（レジが少ない）'; diffEl.textContent = '−¥' + fmt(Math.abs(diff)); diffEl.className = 'status-bad';
  }
}

['startCash','cashSales','otherCashSales','cardSales','cardSalesPaypay','atmDeposit','endCashActual'].forEach(id=>{

function esc(s){
  return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function buildPrintHtml(d){
  const diffText = d.diff===0 ? '±0' : (d.diff>0?'+':'−')+fmt(Math.abs(d.diff));
  let rows = '';
  function row(label, value, sub){
    rows += '<div class="p-row"><div class="p-label">■'+esc(label)+'</div><div class="p-value">'+value+'</div></div>';
    if(sub) rows += '<div class="p-sub">'+sub+'</div>';
  }
  row('シフト開始時のレジ金', fmt(d.startCash)+' 円');
  row('現金売上', fmt(d.cashSales)+' 円');
  row('クレジットカード売上', fmt(d.cardSales)+' 円', d.cardSalesPaypay ? '内 PayPay　¥'+fmt(d.cardSalesPaypay) : '');
  row('その他現金売上', fmt(d.otherCashSales)+' 円');
  row('その他クレジットカード売上', fmt(d.otherCardTotal)+' 円',
    d.otherCardItems.map(i=> esc(i.name)+' ¥'+fmt(i.amount)).join('　/　'));
  row('経費', fmt(d.expenseTotal)+' 円',
    d.expenseItems.map(i=> esc(i.name)+' ¥'+fmt(i.amount)).join('　/　'));
  const wageSub = d.staffResults.map(r=>{
    let l = esc(r.name)+'　'+r.points+'pt／時給¥'+fmt(r.wageTier)+'×'+r.hours+'h';
    if(r.fare) l += '＋交通費¥'+fmt(r.fare);
    if(r.backTotal) l += '＋バック¥'+fmt(r.backTotal);
    l += '＝¥'+fmt(r.wage);
    return l;
  }).join('<br>');
  row('日払い給料', fmt(d.wageTotal)+' 円', wageSub);
  row('合計客数', fmt(d.totalCustomers)+' 人', 'うち新規客数　'+fmt(d.newCustomers)+' 人');
  row('ATM入金額', fmt(d.atmDeposit)+' 円');
  row('シフト終了後のレジ金', fmt(d.endCashActual)+' 円');
  row('過不足', diffText+' 円');
  row('集計をした人', esc(d.countedBy));

  return ''+
    '<div class="p-title">売上集計用紙</div>'+
    '<div class="p-meta">'+esc(d.date)+'（'+esc(d.shift)+'）</div>'+
    '<div class="p-meta">シフトに入っている人　'+esc(d.staffNote)+'</div>'+
    '<div class="p-rows">'+rows+'</div>';
}

let lastPdf = null;
let lastFileName = '';

async function generatePdf(){
  const btn = document.getElementById('pdfBtn');
  const msg = document.getElementById('pdfMsg');
  btn.disabled = true;
  msg.textContent = '作成中…';
  try{
    const data = gatherData();
    const area = document.getElementById('printArea');
    area.innerHTML = buildPrintHtml(data);

    const canvas = await html2canvas(area, { scale:2, backgroundColor:'#ffffff' });
    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p','mm','a4');
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const imgWidth = pageWidth;
    const imgHeight = canvas.height * imgWidth / canvas.width;

    let heightLeft = imgHeight;
    let position = 0;
    pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
    while(heightLeft > 0){
      position = heightLeft - imgHeight;
      pdf.addPage();
      pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
    }

    lastPdf = pdf;
    lastFileName = (data.date||'売上集計')+'_'+(data.shift||'')+'.pdf';

    document.getElementById('pdfPreviewImg').src = imgData;
    document.getElementById('pdfPreview').style.display = 'block';
    document.getElementById('pdfPreview').scrollIntoView({ behavior:'smooth', block:'start' });
    msg.textContent = '';
  } catch(e){
    console.error(e);
    msg.textContent = '作成に失敗しました';
    setTimeout(()=>{ msg.textContent=''; }, 2500);
  } finally {
    btn.disabled = false;
  }
}

function downloadPdf(){
  if(lastPdf) lastPdf.save(lastFileName || '売上集計.pdf');
}
function closePdfPreview(){
  document.getElementById('pdfPreview').style.display = 'none';
}

// PWA install support: register a same-origin service worker generated at
// runtime (via Blob URL) so the whole app stays a single portable HTML file.
// Only intercepts same-origin page requests; external CDN scripts (html2canvas,
// jsPDF) are left completely untouched to avoid interfering with them.
if ('serviceWorker' in navigator) {
  const swCode = `
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('activate', e => self.clients.claim());
    self.addEventListener('fetch', e => {
      const req = e.request;
      let sameOrigin = false;
      try { sameOrigin = new URL(req.url).origin === self.location.origin; } catch(err) {}
      if (req.method !== 'GET' || !sameOrigin) return; // let it pass through untouched
      e.respondWith(
        fetch(req).then(res => {
          const resClone = res.clone();
          caches.open('sales-form-v1').then(c => c.put(req, resClone)).catch(()=>{});
          return res;
        }).catch(() => caches.match(req))
      );
    });
  `;
  const blob = new Blob([swCode], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(()=>{});
}

// Keep the bottom receipt bar visible above the on-screen keyboard: mobile
// keyboards shrink the visual viewport without moving fixed-position
// elements, which otherwise end up hidden behind the keyboard while typing.
if (window.visualViewport) {
  const receiptEl = document.getElementById('receiptBar');
  function adjustReceiptForKeyboard(){
    const vv = window.visualViewport;
    const keyboardHeight = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    if (receiptEl) receiptEl.style.bottom = keyboardHeight + 'px';
  }
  window.visualViewport.addEventListener('resize', adjustReceiptForKeyboard);
  window.visualViewport.addEventListener('scroll', adjustReceiptForKeyboard);

  // iOS Safari in particular can fire the viewport resize slightly out of
  // sync with the keyboard's own show/hide animation, so also re-check right
  // as fields gain/lose focus, a little after the keyboard has had time to animate.
  document.addEventListener('focusin', (e)=>{
    if(/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)){
      setTimeout(adjustReceiptForKeyboard, 50);
      setTimeout(adjustReceiptForKeyboard, 300);
      setTimeout(adjustReceiptForKeyboard, 600);
    }
  });
  document.addEventListener('focusout', ()=>{
    setTimeout(adjustReceiptForKeyboard, 50);
    setTimeout(adjustReceiptForKeyboard, 300);
  });
}

(async function init(){
  await loadSettings();
  addRow('expenseList','expense');
  addStaff();
  recalc();
})();

// Safety net: on some browsers, form controls (selects etc.) can be restored
// to a previous value by the browser itself (autofill / back-forward cache)
// slightly after our initial script run finishes, which can leave the
// displayed totals out of sync until the person taps something. Re-run the
// calculation once more after full load and again on pageshow (which also
// fires when the page is restored from bfcache) to make sure everything
// shown matches what's actually in the fields.
window.addEventListener('load', ()=>{ setTimeout(recalc, 50); });
window.addEventListener('pageshow', ()=>{ recalc(); });
</script>
</body>
</html>
