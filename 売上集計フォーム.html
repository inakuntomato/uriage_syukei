<style>
  :root{
    --paper:#efe9dc; --paper-line:#d8cfb8; --ink:#26302b; --ink-soft:#5b6259;
    --teal:#2f6f5e; --teal-deep:#1f4f42; --alert:#c1502e; --alert-bg:#f3ddd3;
    --ok-bg:#e1ebe1; --card:#f7f4ea; --gold:#b8863f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(90,90,60,0.05) 28px), var(--paper);
    color:var(--ink); font-family:-apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    padding-bottom:120px;
  }
  header{ padding:28px 20px 18px; text-align:center; }
  header h1{ font-family:Georgia,"Hiragino Mincho ProN","Yu Mincho",serif; font-size:22px; letter-spacing:.08em; margin:0 0 4px; }
  header p{ margin:0; font-size:12px; color:var(--ink-soft); letter-spacing:.05em; }
  .wrap{max-width:520px;margin:0 auto;padding:0 14px;}
  .card{ background:var(--card); border:1px solid var(--paper-line); border-radius:2px; padding:16px 16px 14px; margin-bottom:14px; box-shadow:0 1px 0 rgba(0,0,0,0.03); }
  .card h2{ font-size:13px; margin:0 0 12px; color:var(--teal-deep); display:flex; align-items:center; gap:6px; letter-spacing:.03em; }
  .card h2::before{content:"■";font-size:10px;color:var(--teal);}
  label{ display:block; font-size:11.5px; color:var(--ink-soft); margin-bottom:4px; }
  .field{margin-bottom:12px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  input[type=text], input[type=number], input[type=date], select{
    width:100%; padding:9px 10px; border:1px solid var(--paper-line); border-radius:3px;
    background:#fff; font-size:15px; font-family:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace; color:var(--ink);
  }
  input[type=text]{font-family:inherit;}
  select{font-family:inherit; font-size:14px;}
  input:focus, select:focus{ outline:2px solid var(--teal); outline-offset:1px; }
  input:disabled{ background:#eee; color:#999; }
  input:read-only{ background:#f1ede2; color:var(--teal-deep); font-family:inherit; }
  .item-row{ display:flex; gap:6px; margin-bottom:8px; align-items:center; }
  .item-row input{flex:1;min-width:0;}
  .item-row input.amount{max-width:100px;flex:0 0 100px;}
  .item-row .del{ flex:0 0 auto; background:none;border:none;color:var(--alert); font-size:18px;line-height:1;cursor:pointer;padding:4px 6px; }
  .add-btn{ display:inline-flex;align-items:center;gap:4px; background:none;border:1px dashed var(--teal); color:var(--teal-deep); font-size:12px;padding:6px 10px;border-radius:3px;cursor:pointer;margin-top:2px; }
  .add-btn.small{font-size:11px;padding:4px 8px;}
  .add-btn:active{background:var(--ok-bg);}

<script>
// ---- 簡易パスワードゲート ----
// 変更したい場合は下のCORRECT_PASSWORD_HASHを新しいパスワードのSHA-256ハッシュに差し替えてください。
// ブラウザのコンソールで以下を実行するとハッシュが得られます:
// crypto.subtle.digest('SHA-256', new TextEncoder().encode('新しいパスワード')).then(b=>console.log(Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')))
const CORRECT_PASSWORD_HASH = '7d7179c146d0d6af4ebd304ab799a718fe949a8dcd660cd6d12fb97915f9ab0a'; // パスワード: 1054

async function sha256Hex(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function tryUnlock(){
  const input = document.getElementById('passwordInput');
  const err = document.getElementById('passwordError');
  const hash = await sha256Hex(input.value);
  if(hash === CORRECT_PASSWORD_HASH){
    document.getElementById('passwordGate').style.display = 'none';
    try{ localStorage.setItem('salesForm_unlocked', '1'); }catch(e){}
  } else {
    err.textContent = 'パスワードが違います';
    input.value = '';
    input.focus();
  }
}
document.addEventListener('DOMContentLoaded', ()=>{
  let alreadyUnlocked = false;
  try{ alreadyUnlocked = localStorage.getItem('salesForm_unlocked') === '1'; }catch(e){}
  if(alreadyUnlocked){
    document.getElementById('passwordGate').style.display = 'none';
  } else {
    document.getElementById('passwordInput').addEventListener('keydown', (e)=>{
      if(e.key === 'Enter') tryUnlock();
    });
  }
});

// ---- generic item rows (経費 / その他CC) ----
function addRow(listId, prefix){
  const id = 'r' + (rowId++);
  const arr = prefix === 'otherCard' ? otherCardRows : expenseRows;
  arr.push(id);
  const list = document.getElementById(listId);
  const div = document.createElement('div');
  div.className = 'item-row'; div.id = id;
  div.innerHTML = '<input type="text" placeholder="項目名" oninput="recalc()">' +
    '<input type="number" class="amount" placeholder="金額" inputmode="numeric" oninput="recalc()">' +
    '<button class="del" onclick="removeRow(\''+id+'\',\''+prefix+'\')">×</button>';
  list.appendChild(div); recalc();
}
function removeRow(id, prefix){
  document.getElementById(id).remove();
  const arr = prefix === 'otherCard' ? otherCardRows : expenseRows;
  const idx = arr.indexOf(id); if(idx>-1) arr.splice(idx,1);
  recalc();
}
function collectItems(ids){
  return ids.map(id=>{
    const el = document.getElementById(id); if(!el) return null;
    const inputs = el.querySelectorAll('input');
    return { name: inputs[0].value, amount: parseFloat(inputs[1].value)||0 };
  }).filter(Boolean);
}

// ---- staff wage cards ----
function hoursOptionsHtml(){
  let html = '<option value="" selected disabled>時間を選択</option>';
  for(let h = 1; h <= 10; h += 0.5){
    html += '<option value="'+h+'">'+h+'h</option>';
  }
  return html;
}
function castOptionsHtml(){
  let html = '<option value="">名前を選択</option>';
  CAST_LIST.forEach(c=>{ html += '<option value="'+c.name+'" data-fare="'+c.fare+'">'+c.name+'</option>'; });
  html += '<option value="__custom__">その他（自由入力）</option>';
  return html;
}
function bottleOptionsHtml(){
  let html = '<option value="">銘柄を選択</option>';
  BOTTLE_GROUP_ORDER.forEach(type=>{
    const items = BOTTLE_ITEMS.filter(it=>it.type===type);
    if(!items.length) return;
    html += '<optgroup label="'+BOTTLE_GROUP_LABELS[type]+'">';
    items.forEach(it=>{
      html += '<option value="'+it.name+'|'+it.amount+'|'+it.type+'">'+it.name+' ¥'+fmt(it.amount)+'</option>';
    });
    html += '</optgroup>';
  });
  html += '<option value="__custom__">自由入力</option>';
  return html;
}

function openSettings(){
  document.getElementById('mainWrap').style.display = 'none';
  document.getElementById('receiptBar').style.display = 'none';
  document.getElementById('settingsView').style.display = 'block';
  renderCastEditList();
  renderBottleEditList();
  window.scrollTo(0,0);
}
function closeSettings(){
  document.getElementById('settingsView').style.display = 'none';
  document.getElementById('mainWrap').style.display = 'block';
  document.getElementById('receiptBar').style.display = 'block';
  refreshAllCastAndBottleSelects();
}

function renderCastEditList(){
  const list = document.getElementById('castEditList');
  list.innerHTML = '';
  CAST_LIST.forEach((c, idx)=>{
    const div = document.createElement('div');
    div.className = 'item-row';
    div.innerHTML =
      '<input type="text" value="'+esc(c.name)+'" placeholder="名前" oninput="updateCastField('+idx+',\'name\',this.value)">' +
      '<input type="number" class="amount" value="'+c.fare+'" placeholder="交通費" inputmode="numeric" oninput="updateCastField('+idx+',\'fare\',this.value)">' +
      '<button class="del" onclick="removeCastRow('+idx+')">×</button>';
    list.appendChild(div);
  });
}
function addCastRow(){
  CAST_LIST.push({name:'', fare:0});
  saveCastList();
  renderCastEditList();
}
function removeCastRow(idx){
  CAST_LIST.splice(idx,1);
  saveCastList();
  renderCastEditList();
}
function updateCastField(idx, field, value){

function renderBottleEditList(){

function addBottleEditRow(){
  BOTTLE_ITEMS.push({name:'', amount:0, type:'bottle'});
  saveBottleItems();
  renderBottleEditList();
}
function removeBottleRow(idx){
  BOTTLE_ITEMS.splice(idx,1);
  saveBottleItems();
  renderBottleEditList();
}
function updateBottleField(idx, field, value){
  BOTTLE_ITEMS[idx][field] = (field==='amount') ? (parseFloat(value)||0) : value;
  saveBottleItems();
}

function refreshAllCastAndBottleSelects(){
  staffIds.forEach(staffId=>{
    const card = document.getElementById(staffId);
    if(!card) return;
    const sel = card.querySelector('.staff-name-select');
    const currentVal = sel.value;
    sel.innerHTML = castOptionsHtml();
    const stillValid = CAST_LIST.some(c=>c.name===currentVal) || currentVal==='__custom__' || currentVal==='';
    sel.value = stillValid ? currentVal : '';

    card.querySelectorAll('.bottle-row').forEach(row=>{
      const rsel = row.querySelector('.bottle-select');
      const currentBVal = rsel.value;
      rsel.innerHTML = bottleOptionsHtml();
      rsel.value = currentBVal;
      if(rsel.value !== currentBVal) rsel.value = '';
      onBottleSelect(rsel);
    });
  });
  recalc();
}

      '<select class="staff-hours" onchange="recalc()">'+hoursOptionsHtml()+'</select>' +
      '<button class="del" onclick="removeStaff(\''+id+'\')">×</button>' +
    '</div>' +
    '<div class="chip-grid">'+chips+'</div>' +
    '<div class="bottle-section">' +
      '<label>ボトル・観覧車バック</label>' +
      '<div class="bottle-list" id="bottle-'+id+'"></div>' +
      '<button class="add-btn small" onclick="addBottleRow(\''+id+'\')">＋ バックを追加</button>' +
    '</div>' +
    '<div class="staff-summary">' +
      '<div><span>獲得ポイント</span><span><b class="pt-total">0</b>pt <span class="pt-next"></span></span></div>' +
      '<div><span>適用時給</span><b class="wage-tier">¥'+fmt(BASE_WAGE)+'</b></div>' +
      '<div class="transport-line"><span class="transport-badge">交通費対象外（3pt未満）</span>' +
        '<input type="number" class="transport-fare" placeholder="交通費" inputmode="numeric" disabled oninput="recalc()"></div>' +
      '<div class="back-line"><span>ボトル・観覧車バック</span><b class="back-total">¥0</b></div>' +

function removeStaff(id){
  document.getElementById(id).remove();
  const idx = staffIds.indexOf(id); if(idx>-1) staffIds.splice(idx,1);
  recalc();
}
function onCastSelect(staffId){
  const card = document.getElementById(staffId);
  const sel = card.querySelector('.staff-name-select');
  const customInput = card.querySelector('.staff-name-custom');
  if(sel.value === '__custom__'){
    customInput.style.display = 'block';
    card.dataset.defaultFare = 0;
  } else {
    customInput.style.display = 'none';
    const opt = sel.options[sel.selectedIndex];
    card.dataset.defaultFare = opt.dataset.fare || 0;
  }
  // reset fare input so new default can apply
  card.querySelector('.transport-fare').value = '';
  recalc();
}
function step(staffId, key, delta){
  const card = document.getElementById(staffId);
  const chip = card.querySelector('.chip[data-key="'+key+'"]');
  const countEl = chip.querySelector('.chip-count');
  let v = parseInt(countEl.textContent) + delta;
  if(v < 0) v = 0;
  countEl.textContent = v;
  recalc();
}

function addBottleRow(staffId){
  const id = 'b' + (rowId++);
  const list = document.getElementById('bottle-' + staffId);
  const div = document.createElement('div');
  div.className = 'bottle-row'; div.id = id;
  div.innerHTML =
    '<select class="bottle-select" onchange="onBottleSelect(this)">'+bottleOptionsHtml()+'</select>' +
    '<label class="tequila-toggle"><input type="checkbox" onchange="recalc()"> テキーラ(×2)</label>' +
    '<input type="text" class="custom-name" placeholder="項目名" oninput="recalc()">' +
    '<input type="number" class="custom-amount" placeholder="金額" inputmode="numeric" oninput="recalc()">' +
    '<span class="bottle-amount">¥0</span>' +
    '<button class="del" onclick="this.parentElement.remove(); recalc();">×</button>';
  list.appendChild(div); recalc();
}
function onBottleSelect(selectEl){
  const row = selectEl.closest('.bottle-row');
  const tequilaToggle = row.querySelector('.tequila-toggle');
  const customName = row.querySelector('.custom-name');
  const customAmount = row.querySelector('.custom-amount');
  const amountSpan = row.querySelector('.bottle-amount');

  if(selectEl.value === '__custom__'){
    customName.style.display = 'block';
    customAmount.style.display = 'block';
    tequilaToggle.style.display = 'none';
    amountSpan.style.display = 'none';
  } else if(selectEl.value === ''){
    customName.style.display = 'none';
    customAmount.style.display = 'none';
    tequilaToggle.style.display = 'none';
    amountSpan.style.display = 'inline';
    amountSpan.textContent = '¥0';
  } else {
    const parts = selectEl.value.split('|');
    const amount = parseFloat(parts[1]);
    const type = parts[2];
    customName.style.display = 'none';
    customAmount.style.display = 'none';
    amountSpan.style.display = 'inline';
    tequilaToggle.style.display = (type === 'wheel') ? 'flex' : 'none';
  }
  recalc();
}

function wageForPoints(pts){
  for(const t of WAGE_TIERS){ if(pts >= t.p) return t.w; }
  return BASE_WAGE;
}
function nextTierHint(pts){
  const asc = [...WAGE_TIERS].sort((a,b)=>a.p-b.p);
  for(const t of asc){ if(pts < t.p) return '次('+t.p+'pt→¥'+fmt(t.w)+')まであと'+(t.p-pts)+'pt'; }
  return '最高ランク到達';
}

function computeStaff(staffId){
  const card = document.getElementById(staffId);
  const sel = card.querySelector('.staff-name-select');
  const customName = card.querySelector('.staff-name-custom');
  const name = (sel.value === '__custom__') ? customName.value : sel.value;
  const hours = parseFloat(card.querySelector('.staff-hours').value) || 0;

  let points = 0;
  card.querySelectorAll('.chip').forEach(chip=>{
    const pt = parseFloat(chip.dataset.pt);
    const count = parseInt(chip.querySelector('.chip-count').textContent) || 0;
    points += pt * count;
  });

  // bottle backs (yen, separate from points)
  let backTotal = 0;
  const bottleItems = [];
  card.querySelectorAll('.bottle-row').forEach(row=>{
    const rsel = row.querySelector('.bottle-select');
    const amountSpan = row.querySelector('.bottle-amount');
    if(rsel.value === '__custom__'){
      const bname = row.querySelector('.custom-name').value;
      const bamt = parseFloat(row.querySelector('.custom-amount').value) || 0;
      backTotal += bamt;
      if(bname || bamt) bottleItems.push({name:bname||'自由入力', amount:bamt});
    } else if(rsel.value !== ''){
      const parts = rsel.value.split('|');
      const bname = parts[0];
      let bamt = parseFloat(parts[1]);
      const type = parts[2];
      const tequilaChecked = row.querySelector('.tequila-toggle input').checked;
      if(type === 'wheel' && tequilaChecked) bamt *= 2;
      amountSpan.textContent = '¥' + fmt(bamt);
      backTotal += bamt;
      bottleItems.push({name:bname + (tequilaChecked?'（テキーラ）':''), amount:bamt});
    }
  });

  const wageTier = wageForPoints(points);
  const transportEligible = points >= TRANSPORT_THRESHOLD;
  const fareInput = card.querySelector('.transport-fare');
  fareInput.disabled = !transportEligible;
  const badge = card.querySelector('.transport-badge');
  if(transportEligible){
    badge.textContent = '交通費対象（往復）';
    badge.classList.add('on');
    if(!fareInput.value){
      const def = parseFloat(card.dataset.defaultFare) || 0;
      if(def) fareInput.value = def;
    }
  } else {
    badge.textContent = '交通費対象外（3pt未満）';
    badge.classList.remove('on');
    fareInput.value = '';
  }
  const fare = transportEligible ? (parseFloat(fareInput.value)||0) : 0;

  const wage = wageTier * hours + fare + backTotal;

  card.querySelector('.pt-total').textContent = points;
  card.querySelector('.pt-next').textContent = nextTierHint(points);
  card.querySelector('.wage-tier').textContent = '¥' + fmt(wageTier);
  card.querySelector('.back-total').textContent = '¥' + fmt(backTotal);
  card.querySelector('.staff-wage').textContent = '¥' + fmt(wage);

  return { name, hours, points, wageTier, fare, bottleItems, backTotal, wage };
}

function recalc(){
  const otherCardItems = collectItems(otherCardRows);
  const expenseItems = collectItems(expenseRows);
  const otherCardTotal = otherCardItems.reduce((s,i)=>s+i.amount,0);
  const expenseTotal = expenseItems.reduce((s,i)=>s+i.amount,0);

  document.getElementById('expenseTotal').textContent = fmt(expenseTotal);

  const staffResults = staffIds.map(computeStaff);
  const wageTotal = staffResults.reduce((s,r)=>s+r.wage,0);
  document.getElementById('wageTotal').textContent = fmt(wageTotal);

  const staffNameStr = staffResults.map(r=>r.name).filter(Boolean).join('・');
  if(!staffNamesManuallyEdited){
    document.getElementById('staffNames').value = staffNameStr;
  }

  const startCash = num('startCash');
  const cashSales = num('cashSales');
  const otherCashSales = num('otherCashSales');
  const atmDeposit = num('atmDeposit');
  const endCashActual = num('endCashActual');

  const theoretical = startCash + cashSales + otherCashSales - expenseTotal - wageTotal - atmDeposit;
  const diff = endCashActual - theoretical;

  document.getElementById('theoLine').textContent = '¥' + fmt(theoretical);
  document.getElementById('actualLine').textContent = '¥' + fmt(endCashActual);

  const diffEl = document.getElementById('diffValue');
  const labelEl = document.getElementById('diffLabel');
  if(diff === 0){
    labelEl.textContent = '過不足'; diffEl.textContent = '±0'; diffEl.className = 'status-ok';
  } else if(diff > 0){
    labelEl.textContent = '過剰（レジが多い）'; diffEl.textContent = '+¥' + fmt(diff); diffEl.className = 'status-bad';
  } else {
    labelEl.textContent = '不足（レジが少ない）'; diffEl.textContent = '−¥' + fmt(Math.abs(diff)); diffEl.className = 'status-bad';
  }
}

['startCash','cashSales','otherCashSales','cardSales','cardSalesPaypay','atmDeposit','endCashActual'].forEach(id=>{
  document.getElementById(id).addEventListener('input', recalc);
});
document.getElementById('staffNames').addEventListener('input', ()=>{ staffNamesManuallyEdited = true; });

function gatherData(){
  const date = document.getElementById('date').value;
  const shift = document.getElementById('shift').value;
  const staffNote = document.getElementById('staffNames').value;
  const startCash = num('startCash');
  const cashSales = num('cashSales');
  const cardSales = num('cardSales');
  const cardSalesPaypay = num('cardSalesPaypay');
  const otherCashSales = num('otherCashSales');
  const otherCardItems = collectItems(otherCardRows);
  const otherCardTotal = otherCardItems.reduce((s,i)=>s+i.amount,0);
  const expenseItems = collectItems(expenseRows);
  const expenseTotal = expenseItems.reduce((s,i)=>s+i.amount,0);
  const staffResults = staffIds.map(id=>computeStaff(id));
  const wageTotal = staffResults.reduce((s,r)=>s+r.wage,0);
  const totalCustomers = num('totalCustomers');
  const newCustomers = num('newCustomers');
  const atmDeposit = num('atmDeposit');
  const endCashActual = num('endCashActual');
  const theoretical = startCash + cashSales + otherCashSales - expenseTotal - wageTotal - atmDeposit;
  const diff = endCashActual - theoretical;
  const countedBy = document.getElementById('countedBy').value;
  return { date, shift, staffNote, startCash, cashSales, cardSales, cardSalesPaypay,
    otherCashSales, otherCardItems, otherCardTotal, expenseItems, expenseTotal,
    staffResults, wageTotal, totalCustomers, newCustomers, atmDeposit, endCashActual,
    theoretical, diff, countedBy };
}

function esc(s){
  return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function buildPrintHtml(d){
  const diffText = d.diff===0 ? '±0' : (d.diff>0?'+':'−')+fmt(Math.abs(d.diff));
  let rows = '';
  function row(label, value, sub){
    rows += '<div class="p-row"><div class="p-label">■'+esc(label)+'</div><div class="p-value">'+value+'</div></div>';
    if(sub) rows += '<div class="p-sub">'+sub+'</div>';
  }
  row('シフト開始時のレジ金', fmt(d.startCash)+' 円');
  row('現金売上', fmt(d.cashSales)+' 円');
  row('クレジットカード売上', fmt(d.cardSales)+' 円', d.cardSalesPaypay ? '内 PayPay　¥'+fmt(d.cardSalesPaypay) : '');
  row('その他現金売上', fmt(d.otherCashSales)+' 円');
  row('その他クレジットカード売上', fmt(d.otherCardTotal)+' 円',
    d.otherCardItems.map(i=> esc(i.name)+' ¥'+fmt(i.amount)).join('　/　'));
  row('経費', fmt(d.expenseTotal)+' 円',
    d.expenseItems.map(i=> esc(i.name)+' ¥'+fmt(i.amount)).join('　/　'));
  const wageSub = d.staffResults.map(r=>{
    let l = esc(r.name)+'　'+r.points+'pt／時給¥'+fmt(r.wageTier)+'×'+r.hours+'h';
    if(r.fare) l += '＋交通費¥'+fmt(r.fare);
    if(r.backTotal) l += '＋バック¥'+fmt(r.backTotal);
    l += '＝¥'+fmt(r.wage);
    return l;
  }).join('<br>');
  row('日払い給料', fmt(d.wageTotal)+' 円', wageSub);
  row('合計客数', fmt(d.totalCustomers)+' 人', 'うち新規客数　'+fmt(d.newCustomers)+' 人');
  row('ATM入金額', fmt(d.atmDeposit)+' 円');
  row('シフト終了後のレジ金', fmt(d.endCashActual)+' 円');
  row('過不足', diffText+' 円');
  row('集計をした人', esc(d.countedBy));

  return ''+
    '<div class="p-title">売上集計用紙</div>'+
    '<div class="p-meta">'+esc(d.date)+'（'+esc(d.shift)+'）</div>'+
    '<div class="p-meta">シフトに入っている人　'+esc(d.staffNote)+'</div>'+
    '<div class="p-rows">'+rows+'</div>';
}

let lastPdf = null;
let lastFileName = '';

async function generatePdf(){
  const btn = document.getElementById('pdfBtn');
  const msg = document.getElementById('pdfMsg');
  btn.disabled = true;
  msg.textContent = '作成中…';
  try{
    const data = gatherData();
    const area = document.getElementById('printArea');
    area.innerHTML = buildPrintHtml(data);

    const canvas = await html2canvas(area, { scale:2, backgroundColor:'#ffffff' });
    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p','mm','a4');
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const imgWidth = pageWidth;
    const imgHeight = canvas.height * imgWidth / canvas.width;

    let heightLeft = imgHeight;
    let position = 0;
    pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
    while(heightLeft > 0){
      position = heightLeft - imgHeight;
      pdf.addPage();
      pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
    }

    lastPdf = pdf;
    lastFileName = (data.date||'売上集計')+'_'+(data.shift||'')+'.pdf';

    document.getElementById('pdfPreviewImg').src = imgData;
    document.getElementById('pdfPreview').style.display = 'block';
    document.getElementById('pdfPreview').scrollIntoView({ behavior:'smooth', block:'start' });
    msg.textContent = '';
  } catch(e){
    console.error(e);
    msg.textContent = '作成に失敗しました';
    setTimeout(()=>{ msg.textContent=''; }, 2500);
  } finally {
    btn.disabled = false;
  }
}

function downloadPdf(){
  if(lastPdf) lastPdf.save(lastFileName || '売上集計.pdf');
}
function closePdfPreview(){
  document.getElementById('pdfPreview').style.display = 'none';
}

// PWA install support: register a same-origin service worker generated at
// runtime (via Blob URL) so the whole app stays a single portable HTML file.
if ('serviceWorker' in navigator) {
  const swCode = `
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('activate', e => self.clients.claim());
    self.addEventListener('fetch', e => {
      // Network-first, falling back to cache for offline reopen of this page.
      e.respondWith(
        fetch(e.request).then(res => {
          const resClone = res.clone();
          caches.open('sales-form-v1').then(c => c.put(e.request, resClone));
          return res;
        }).catch(() => caches.match(e.request))
      );
    });
  `;
  const blob = new Blob([swCode], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(()=>{});
}

(async function init(){
  await loadSettings();
  addRow('expenseList','expense');
  addStaff();
  recalc();
})();
